[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fixforge"
version = "0.2.0"
description = "Evidence-first software repair, with a human at the merge gate."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.9,<3"]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<10"]

[project.scripts]
fixforge = "fixforge.__main__:main"

[tool.setuptools.packages.find]
include = ["fixforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
